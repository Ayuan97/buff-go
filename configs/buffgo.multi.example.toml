# buffgo multi-game model config (P5.1).
# Default production stays single-game Rust in buffgo.example.toml.
# This file enables a second appid (CS2 730) only to validate that appid
# flows through config / jobs / quota / catalog / quote paths — not for
# long-running dual monitoring unless you choose to.

[database]
driver = "postgres"
dsn = "postgres://buffgo:buffgo@127.0.0.1:5432/buffgo?sslmode=disable"

[redis]
addr = "127.0.0.1:6379"
password = ""
db = 0

[games]
# Multi-game (multiple appids on one machine) — not multi-host.
# See docs/ARCHITECTURE.md (directory: multi.example = 多游戏非多机).
enabled_appids = [252490, 730]

[games.quota.252490]
weight = 70
max_inflight = 20
max_proxy_leases = 10

[games.quota.730]
weight = 30
max_inflight = 8
max_proxy_leases = 5

[pool]
lease_ttl = "30s"
# Legacy compatibility value only; Goal 0B has not verified Steam cooldowns.
default_platform_cooldown = "3m"

[pool.platform_lines]
buff = ["cn", "dual", "hk"]
steam = ["oversea", "dual", "hk"]

# Legacy compatibility settings; none of these values is verified Steam evidence.
# 限频键：(proxy_id|direct, platform=steam, class=search)
[steam.search]
min_interval = "2s"
max_per_window = 80
hard_max_per_window = 100
cooldown_on_429 = "3m"
window = "5m"

[jobs.steam_sell_rust]
platform = "steam"
side = "ask"
appid = 252490
enabled = true
interval = "60s"
needs_account = false
# Legacy example delay only; it is not a verified safe Steam interval.
page_delay = "2s"

[jobs.buff_sell_rust]
platform = "buff"
side = "ask"
appid = 252490
enabled = true
interval = "30s"
needs_account = true

[jobs.steam_sell_cs2]
platform = "steam"
side = "ask"
appid = 730
enabled = true
interval = "60s"
needs_account = false
# Legacy example delay only; it is not a verified safe Steam interval.
page_delay = "2s"

[jobs.buff_sell_cs2]
platform = "buff"
side = "ask"
appid = 730
enabled = true
interval = "30s"
needs_account = true
