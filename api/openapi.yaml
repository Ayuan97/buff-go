openapi: 3.1.0
info:
  title: buffgo local control API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/security/context:
    get:
      operationId: getSecurityContext
      summary: Create a short-lived browser control session
      responses:
        "200":
          description: Security context created without changing business data
          headers:
            Set-Cookie:
              description: Host-only HttpOnly SameSite=Strict control-session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityContext"
        "421":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /api/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: Control-plane capability flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /api/accounts:
    get:
      operationId: listAccounts
      security: []
      responses:
        "200":
          description: Credential-safe account summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Account created; session is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    get:
      operationId: getAccount
      security: []
      responses:
        "200":
          description: Credential-safe account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/accounts/{id}/alias:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: renameAccount
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAliasReplace"
      responses:
        "200":
          description: Alias updated; session is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/accounts/{id}/session:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: replaceAccountSession
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSessionReplace"
      responses:
        "200":
          description: Session replaced; raw session is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/accounts/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: deleteAccount
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Account deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes:
    get:
      operationId: listNodes
      responses:
        "200":
          description: Credential-safe access nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
    post:
      operationId: createNode
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreate"
      responses:
        "201":
          description: Node created in validating state; proxy credential is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      operationId: getNode
      responses:
        "200":
          description: Credential-safe node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/name:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: renameNode
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRename"
      responses:
        "200":
          description: Name updated; connection and assignment stay unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/connection:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: replaceNodeConnection
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeConnectionReplace"
      responses:
        "200":
          description: Connection replaced; node returns to validating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/exit:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: recordNodeExit
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeExit"
      responses:
        "200":
          description: Manual exit evidence recorded; node becomes available when valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/assign-game:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: assignNodeGame
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeAssignGame"
      responses:
        "200":
          description: Game quota assigned or cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/assign-side:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: assignNodeSide
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeAssignSide"
      responses:
        "200":
          description: Game-platform-side assignment set or cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: deleteNode
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Node deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/combinations:
    get:
      operationId: listCombinations
      responses:
        "200":
          description: Account-node combinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Combination"
    post:
      operationId: createCombination
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CombinationCreate"
      responses:
        "201":
          description: Combination created; platform is derived from the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combination"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/combinations/{id}:
    parameters:
      - $ref: "#/components/parameters/CombinationID"
    get:
      operationId: getCombination
      responses:
        "200":
          description: One account-node combination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combination"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/combinations/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/CombinationID"
    post:
      operationId: deleteCombination
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Combination deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/watermarks:
    get:
      operationId: listWatermarks
      responses:
        "200":
          description: Short-pool minimums; usable is current short nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Watermark"
    post:
      operationId: setWatermark
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatermarkSet"
      responses:
        "200":
          description: Watermark updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watermark"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/providers:
    get:
      operationId: listProviders
      responses:
        "200":
          description: Credential-safe vendor summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      operationId: createProvider
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCreate"
      responses:
        "201":
          description: Provider created; credential is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/providers/{id}/update:
    parameters:
      - $ref: "#/components/parameters/ProviderID"
    post:
      operationId: updateProvider
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/providers/{id}/credential:
    parameters:
      - $ref: "#/components/parameters/ProviderID"
    post:
      operationId: replaceProviderCredential
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCredentialReplace"
      responses:
        "200":
          description: Credential replaced; raw credential is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/providers/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/ProviderID"
    post:
      operationId: deleteProvider
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Provider deleted
        "404":
          $ref: "#/components/responses/Error"
  /api/targets:
    get:
      operationId: listTargets
      responses:
        "200":
          description: Summary collection targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
    post:
      operationId: createTarget
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetCreate"
      responses:
        "201":
          description: Target created or existing identical target returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/targets/{id}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      operationId: getTarget
      responses:
        "200":
          description: One summary target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/targets/{id}/desired:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      operationId: setTargetDesired
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetDesired"
      responses:
        "200":
          description: Desired state applied; actual state follows scheduler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/targets/{id}/sort:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      operationId: setTargetSortOrder
      description: >-
        Changes the platform ordering this target collects with. The cursor is a
        list offset, so this voids the active batch and the next cycle restarts
        from the beginning. Stored market facts are kept.
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetSortOrder"
      responses:
        "200":
          description: Ordering applied; the active batch is voided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/targets/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      operationId: deleteTarget
      description: Only a disabled and stopped target that never ran can be deleted; collection history is never removed
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Target deleted
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/runs:
    get:
      operationId: listRuns
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Recent collection runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
  /api/runs/{id}/pages:
    get:
      operationId: listRunPages
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Committed pages of one run
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionPage"
        "400": {$ref: "#/components/responses/Error"}
  /api/runs/{id}/pages/{sequence}/payload:
    get:
      operationId: getRunPagePayload
      description: >-
        Raw platform response for one page, returned verbatim. Only the most
        recent pages are retained, and directions that issue one request per
        product never store a payload.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: sequence
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Raw platform response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/runs/{id}/pages/{sequence}/attempts:
    get:
      operationId: listRunPageAttempts
      description: >-
        Market facts still attributed to this page. Later runs overwrite a
        product's latest attempt, so older pages report fewer rows over time.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - name: sequence
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Market facts written by this page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageAttempt"
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/quote-facets:
    get:
      operationId: listQuoteFacets
      description: Games and item types present in collected data, for filter options.
      parameters:
        - name: appid
          in: query
          description: Scopes item types to one game. Games are always listed in full.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Available filter options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [appids, item_types]
                properties:
                  appids:
                    type: array
                    items: {type: integer, format: int64, minimum: 1}
                  item_types:
                    type: array
                    items: {type: string}
        "400": {$ref: "#/components/responses/Error"}
  /api/quotes:
    get:
      operationId: listQuotes
      parameters:
        - name: appid
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: platform
          in: query
          schema: {type: string}
        - name: side
          in: query
          schema: {type: string, enum: [bid, ask]}
        - name: keyword
          in: query
          description: Case-insensitive substring match on the product name.
          schema: {type: string, maxLength: 128}
        - name: item_type
          in: query
          schema: {type: string, maxLength: 128}
        - name: min_cents
          in: query
          description: Only products with a last present price at or above this value.
          schema: {type: integer, format: int64, minimum: 0}
        - name: max_cents
          in: query
          schema: {type: integer, format: int64, minimum: 0}
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_desc, price_asc, listings_desc, name]
            default: price_desc
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 60}
      responses:
        "200":
          description: One page of latest attempts with the total match count
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [total, quotes]
                properties:
                  total: {type: integer, format: int64, minimum: 0}
                  quotes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Quote"
components:
  parameters:
    AccountID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    NodeID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CombinationID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProviderID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TargetID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  securitySchemes:
    controlSession:
      type: apiKey
      in: cookie
      name: buffgo_control_session
    csrfToken:
      type: apiKey
      in: header
      name: X-Buffgo-CSRF
  schemas:
    SecurityContext:
      type: object
      additionalProperties: false
      required:
        - csrf_token
        - expires_at
      properties:
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
        expires_at:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - invalid_host
            - method_not_allowed
            - origin_rejected
            - origin_required
            - json_required
            - csrf_rejected
            - internal_error
            - invalid_account_id
            - account_not_found
            - account_occupied
            - account_in_use
            - account_revision_conflict
            - session_required
            - session_too_large
            - invalid_json
            - body_not_allowed
            - resource_storage_unavailable
            - resource_integrity
            - resource_error
            - not_found
            - invalid_account
            - account_conflict
            - invalid_node_id
            - node_not_found
            - node_occupied
            - node_in_use
            - node_revision_conflict
            - node_assignment_conflict
            - node_name_conflict
            - platform_region_mismatch
            - invalid_node
            - invalid_exit_address
            - invalid_combination_id
            - combination_not_found
            - combination_occupied
            - combination_incompatible
            - combination_conflict
            - invalid_combination
            - resource_in_use
            - credential_required
            - credential_too_large
            - invalid_provider_id
            - provider_not_found
            - provider_revision_conflict
            - provider_conflict
            - invalid_provider
            - invalid_target_id
            - target_not_found
            - collection_not_found
            - collection_conflict
            - target_not_stopped
            - collection_in_use
            - invalid_collection
            - collection_storage_unavailable
            - collection_error
            - invalid_run_id
            - invalid_page_sequence
            - page_payload_not_found
            - invalid_limit
            - invalid_offset
            - invalid_price_range
            - invalid_appid
            - invalid_quotes
    Capabilities:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: {type: string, enum: [detail_unavailable]}
    Account:
      type: object
      additionalProperties: false
      required: [id, platform, alias, session_state, session_revision]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        platform: {type: string}
        alias: {type: string}
        session_state: {type: string, enum: [unverified, valid, invalid]}
        session_revision: {type: integer, format: int64, minimum: 1}
        last_checked_at: {type: string, format: date-time}
    AccountCreate:
      type: object
      additionalProperties: false
      required: [platform, alias, session]
      properties:
        platform: {type: string}
        alias: {type: string}
        session: {type: string, writeOnly: true, minLength: 1, maxLength: 262144}
    AccountAliasReplace:
      type: object
      additionalProperties: false
      required: [alias]
      properties:
        alias: {type: string, minLength: 1, maxLength: 128}
    AccountSessionReplace:
      type: object
      additionalProperties: false
      required: [expected_revision, session]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        session: {type: string, writeOnly: true, minLength: 1, maxLength: 262144}
    Node:
      type: object
      additionalProperties: false
      required: [id, name, kind, region, egress_mode, state, egress_revision, assignment_revision, sides, has_proxy_credential]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        kind: {type: string, enum: [direct, proxy]}
        region: {type: string, enum: [domestic, foreign, hongkong]}
        egress_mode: {type: string, enum: [static, sticky]}
        state: {type: string, enum: [validating, available, unavailable]}
        egress_revision: {type: integer, format: int64, minimum: 1}
        assignment_revision: {type: integer, format: int64, minimum: 1}
        appid: {type: integer, format: int64, minimum: 1}
        sides:
          type: array
          items:
            $ref: "#/components/schemas/NodeSide"
        has_proxy_credential: {type: boolean}
        sticky_session_valid_until: {type: string, format: date-time}
        exit:
          $ref: "#/components/schemas/NodeExitView"
    NodeSide:
      type: object
      additionalProperties: false
      required: [platform, side]
      properties:
        platform: {type: string}
        side: {type: string, enum: [bid, ask]}
    NodeExitView:
      type: object
      additionalProperties: false
      required: [address, verified_at, valid_until]
      properties:
        address: {type: string}
        verified_at: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
    NodeCreate:
      type: object
      additionalProperties: false
      required: [name, kind, region, egress_mode]
      properties:
        name: {type: string}
        kind: {type: string, enum: [direct, proxy]}
        region: {type: string, enum: [domestic, foreign, hongkong]}
        egress_mode: {type: string, enum: [static, sticky]}
        sticky_session_valid_until: {type: string, format: date-time}
        proxy_credential: {type: string, writeOnly: true}
    NodeRename:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
    NodeConnectionReplace:
      type: object
      additionalProperties: false
      required: [expected_egress_revision, kind, region, egress_mode]
      properties:
        expected_egress_revision: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [direct, proxy]}
        region: {type: string, enum: [domestic, foreign, hongkong]}
        egress_mode: {type: string, enum: [static, sticky]}
        sticky_session_valid_until: {type: string, format: date-time}
        proxy_credential: {type: string, writeOnly: true}
    NodeExit:
      type: object
      additionalProperties: false
      required: [expected_egress_revision, address, valid_until]
      properties:
        expected_egress_revision: {type: integer, format: int64, minimum: 1}
        address: {type: string}
        valid_until: {type: string, format: date-time}
    NodeAssignGame:
      type: object
      additionalProperties: false
      required: [expected_assignment_revision]
      properties:
        expected_assignment_revision: {type: integer, format: int64, minimum: 1}
        appid: {type: integer, format: int64, minimum: 0}
    NodeAssignSide:
      type: object
      additionalProperties: false
      required: [expected_assignment_revision, platform]
      properties:
        expected_assignment_revision: {type: integer, format: int64, minimum: 1}
        platform: {type: string}
        side: {type: string, enum: [bid, ask]}
    Combination:
      type: object
      additionalProperties: false
      required: [id, platform, account_id, node_id]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        platform: {type: string}
        account_id: {type: integer, format: int64, minimum: 1}
        node_id: {type: integer, format: int64, minimum: 1}
    Watermark:
      type: object
      additionalProperties: false
      required: [region, min_usable, usable, revision]
      properties:
        region: {type: string, enum: [domestic, foreign, hongkong]}
        min_usable: {type: integer, minimum: 0}
        usable: {type: integer, minimum: 0}
        revision: {type: integer, format: int64, minimum: 1}
    WatermarkSet:
      type: object
      additionalProperties: false
      required: [region, expected_revision, min_usable]
      properties:
        region: {type: string, enum: [domestic, foreign, hongkong]}
        expected_revision: {type: integer, format: int64, minimum: 1}
        min_usable: {type: integer, minimum: 0}
    Provider:
      type: object
      additionalProperties: false
      required: [id, name, enabled, priority, regions, has_credential, revision]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 1, maximum: 10000}
        regions:
          type: array
          items: {type: string, enum: [domestic, foreign, hongkong]}
        has_credential: {type: boolean}
        revision: {type: integer, format: int64, minimum: 1}
    ProviderCreate:
      type: object
      additionalProperties: false
      required: [name, priority, regions, credential]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 1, maximum: 10000}
        regions:
          type: array
          items: {type: string, enum: [domestic, foreign, hongkong]}
        credential: {type: string, writeOnly: true, minLength: 1, maxLength: 65536}
    ProviderUpdate:
      type: object
      additionalProperties: false
      required: [expected_revision, name, enabled, priority, regions]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 1, maximum: 10000}
        regions:
          type: array
          items: {type: string, enum: [domestic, foreign, hongkong]}
    ProviderCredentialReplace:
      type: object
      additionalProperties: false
      required: [expected_revision, credential]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        credential: {type: string, writeOnly: true, minLength: 1, maxLength: 65536}
    CombinationCreate:
      type: object
      additionalProperties: false
      required: [account_id, node_id]
      properties:
        account_id: {type: integer, format: int64, minimum: 1}
        node_id: {type: integer, format: int64, minimum: 1}
    Target:
      type: object
      additionalProperties: false
      required: [id, revision, platform, appid, side, desired, actual, switch_version, changed_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        revision: {type: integer, format: int64, minimum: 1}
        platform: {type: string}
        appid: {type: integer, format: int64, minimum: 1}
        side: {type: string, enum: [bid, ask]}
        desired: {type: string, enum: [enabled, disabled]}
        actual: {type: string, enum: [starting, waiting, running, blocked, stopping, stopped, error]}
        switch_version: {type: integer, format: int64, minimum: 1}
        reason: {type: string}
        recovery: {type: string}
        sort_column:
          type: string
          enum: [price, quantity, name]
          description: Platform ordering this target collects with.
        sort_dir: {type: string, enum: [asc, desc]}
        recheck_at: {type: string, format: date-time}
        changed_at: {type: string, format: date-time}
    TargetCreate:
      type: object
      additionalProperties: false
      required: [platform, appid, side]
      properties:
        platform: {type: string}
        appid: {type: integer, format: int64, minimum: 1}
        side: {type: string, enum: [bid, ask]}
        desired: {type: string, enum: [enabled, disabled]}
    TargetDesired:
      type: object
      additionalProperties: false
      required: [expected_revision, desired]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        desired: {type: string, enum: [enabled, disabled]}
    TargetSortOrder:
      type: object
      additionalProperties: false
      required: [expected_revision, sort_column, sort_dir]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        sort_column: {type: string, enum: [price, quantity, name]}
        sort_dir: {type: string, enum: [asc, desc]}
    Run:
      type: object
      additionalProperties: false
      required: [id, task_type, platform, appid, state, last_page_sequence, created_at]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        target_id: {type: integer, format: int64, minimum: 1}
        task_type: {type: string, enum: [summary, detail]}
        platform: {type: string}
        appid: {type: integer, format: int64, minimum: 1}
        side: {type: string, enum: [bid, ask]}
        state: {type: string, enum: [pending, running, succeeded, failed, stopped]}
        completeness: {type: string, enum: [complete, partial]}
        reason: {type: string}
        cursor: {type: string}
        last_page_sequence: {type: integer, format: int64, minimum: 0}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    CollectionPage:
      type: object
      additionalProperties: false
      required: [page_sequence, collected_at, committed_at, payload_bytes]
      properties:
        page_sequence: {type: integer, format: int64, minimum: 1}
        cursor_before: {type: string}
        cursor_after: {type: string}
        collected_at: {type: string, format: date-time}
        committed_at: {type: string, format: date-time}
        payload_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Uncompressed size of the retained raw response, 0 when none is kept.
        account_id:
          type: integer
          format: int64
          minimum: 1
          description: Account that fetched this page. Absent for pages committed before attribution existed.
        account_alias: {type: string}
        exit_address:
          type: string
          description: Egress IP used for this page, as seen by the platform.
    PageAttempt:
      type: object
      additionalProperties: false
      required: [product_id, appid, name, platform, side, status, collected_at]
      properties:
        product_id: {type: integer, format: int64, minimum: 1}
        appid: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        platform: {type: string}
        side: {type: string, enum: [bid, ask]}
        status: {type: string, enum: [present, empty, unavailable, failed]}
        reason_code: {type: string}
        collected_at: {type: string, format: date-time}
        source_time: {type: string, format: date-time}
        present_cents: {type: integer, format: int64, minimum: 0}
        present_order_count: {type: integer, format: int64, minimum: 0}
    Quote:
      type: object
      additionalProperties: false
      required: [product_id, appid, name, platform, side, status, collected_at]
      properties:
        product_id: {type: integer, format: int64, minimum: 1}
        appid: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        icon_path:
          type: string
          maxLength: 512
          description: >-
            Platform image path fragment, never a full URL and never containing
            a slash. Clients prepend the Steam economy image CDN prefix.
        item_type:
          type: string
          maxLength: 128
          description: Platform category. Absent for games that do not report one.
        name_color:
          type: string
          pattern: "^[0-9a-fA-F]{6}$"
          description: Quality color without a leading hash.
        platform: {type: string}
        side: {type: string, enum: [bid, ask]}
        status: {type: string, enum: [present, empty, unavailable, failed]}
        reason_code: {type: string}
        collected_at: {type: string, format: date-time}
        source_time: {type: string, format: date-time}
        present_cents: {type: integer, format: int64, minimum: 0}
        present_order_count: {type: integer, format: int64, minimum: 0}
        present_collected_at: {type: string, format: date-time}
  responses:
    Error:
      description: Request rejected without reflecting request data or credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
