openapi: 3.1.0
info:
  title: buffgo local control API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/security/context:
    get:
      operationId: getSecurityContext
      summary: Create a short-lived browser control session
      responses:
        "200":
          description: Security context created without changing business data
          headers:
            Set-Cookie:
              description: Host-only HttpOnly SameSite=Strict control-session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityContext"
        "421":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "405":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /api/capabilities:
    get:
      operationId: getCapabilities
      responses:
        "200":
          description: Control-plane capability flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /api/accounts:
    get:
      operationId: listAccounts
      security: []
      responses:
        "200":
          description: Credential-safe account summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Account created; session is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    get:
      operationId: getAccount
      security: []
      responses:
        "200":
          description: Credential-safe account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/accounts/{id}/alias:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: renameAccount
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAliasReplace"
      responses:
        "200":
          description: Alias updated; session is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/accounts/{id}/session:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: replaceAccountSession
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSessionReplace"
      responses:
        "200":
          description: Session replaced; raw session is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/accounts/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: deleteAccount
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Account deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes:
    get:
      operationId: listNodes
      responses:
        "200":
          description: Credential-safe access nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
    post:
      operationId: createNode
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeCreate"
      responses:
        "201":
          description: Node created in validating state; proxy credential is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    get:
      operationId: getNode
      responses:
        "200":
          description: Credential-safe node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/name:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: renameNode
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeRename"
      responses:
        "200":
          description: Name updated; connection and exit evidence stay unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/connection:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: replaceNodeConnection
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeConnectionReplace"
      responses:
        "200":
          description: Connection replaced; node returns to validating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/exit:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: recordNodeExit
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeExit"
      responses:
        "200":
          description: Manual exit evidence recorded; node becomes available when valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/nodes/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/NodeID"
    post:
      operationId: deleteNode
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Node deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/combinations:
    get:
      operationId: listCombinations
      responses:
        "200":
          description: Account-node combinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Combination"
    post:
      operationId: createCombination
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CombinationCreate"
      responses:
        "201":
          description: Combination created; platform is derived from the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combination"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/combinations/{id}:
    parameters:
      - $ref: "#/components/parameters/CombinationID"
    get:
      operationId: getCombination
      responses:
        "200":
          description: One account-node combination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combination"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/combinations/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/CombinationID"
    post:
      operationId: deleteCombination
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Combination deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/watermarks:
    get:
      operationId: listWatermarks
      responses:
        "200":
          description: Short-pool minimums; usable is current short nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Watermark"
    post:
      operationId: setWatermark
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatermarkSet"
      responses:
        "200":
          description: Watermark updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Watermark"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/providers:
    get:
      operationId: listProviders
      responses:
        "200":
          description: Credential-safe vendor summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      operationId: createProvider
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCreate"
      responses:
        "201":
          description: Provider created; credential is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/providers/{id}/update:
    parameters:
      - $ref: "#/components/parameters/ProviderID"
    post:
      operationId: updateProvider
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/providers/{id}/credential:
    parameters:
      - $ref: "#/components/parameters/ProviderID"
    post:
      operationId: replaceProviderCredential
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCredentialReplace"
      responses:
        "200":
          description: Credential replaced; raw credential is never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/providers/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/ProviderID"
    post:
      operationId: deleteProvider
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Provider deleted
        "404":
          $ref: "#/components/responses/Error"
  /api/targets:
    get:
      operationId: listTargets
      responses:
        "200":
          description: Summary collection targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
    post:
      operationId: createTarget
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetCreate"
      responses:
        "201":
          description: Target created or existing identical target returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/targets/{id}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      operationId: getTarget
      responses:
        "200":
          description: One summary target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/targets/{id}/desired:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      operationId: setTargetDesired
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetDesired"
      responses:
        "200":
          description: Desired state applied; actual state follows scheduler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/targets/{id}/sort:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      operationId: setTargetSortOrder
      description: >-
        Changes the platform ordering this target collects with. The refill
        cursor is a list offset, so this advances switch_version, clears the
        direction queue, and resets the refill cursor. Stored market facts and
        write_seq are kept.
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetSortOrder"
      responses:
        "200":
          description: Ordering applied; the direction queue is cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/targets/{id}/price-range:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      operationId: setTargetPriceRange
      description: >-
        Sets the CNY fen bounds sent to Steam search/render as price_min /
        price_max / price_currency=23. Bid collection has no matching Steam
        parameter. Changing bounds advances switch_version and clears the
        direction queue. Stored market facts and write_seq are kept.
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetPriceRange"
      responses:
        "200":
          description: Price range applied; the direction queue is cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/targets/{id}/steam-facets:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      operationId: setTargetSteamFacets
      description: >-
        Sets Rust category_steamcat / category_itemclass multi-select sent to
        Steam search/render. Bid collection has no matching Steam parameter.
        Changing the selection advances switch_version and clears the
        direction queue. Stored market facts and write_seq are kept.
        Only Rust (appid 252490) accepts a non-empty selection.
      security:
        - controlSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetSteamFacets"
      responses:
        "200":
          description: Facets applied; the direction queue is cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/targets/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      operationId: deleteTarget
      description: Only a disabled and stopped target that never ran can be deleted; collection history is never removed
      security:
        - controlSession: []
          csrfToken: []
      responses:
        "200":
          description: Target deleted
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/workers:
    get:
      operationId: listWorkers
      description: >-
        One row per account-node combination. Idle workers have no claim;
        busy workers include the current direction and the latest page items.
      responses:
        "200":
          description: Account plus egress IP workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
  /api/steam-facets:
    get:
      operationId: listSteamFacets
      description: Static Steam market facet vocabulary for one game. Rust returns category and item class slugs.
      parameters:
        - name: appid
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Facet vocabulary; empty lists when the game has none
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories, item_classes]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [slug, label, name]
                      properties:
                        slug: {type: string}
                        label: {type: string}
                        name: {type: string}
                  item_classes:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [slug, label, name, category]
                      properties:
                        slug: {type: string}
                        label: {type: string}
                        name: {type: string}
                        category: {type: string}
        "400": {$ref: "#/components/responses/Error"}
  /api/quote-facets:
    get:
      operationId: listQuoteFacets
      description: Games and item types present in collected data, for filter options.
      parameters:
        - name: appid
          in: query
          description: Scopes item types to one game. Games are always listed in full.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Available filter options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [appids, item_types]
                properties:
                  appids:
                    type: array
                    items: {type: integer, format: int64, minimum: 1}
                  item_types:
                    type: array
                    items: {type: string}
        "400": {$ref: "#/components/responses/Error"}
  /api/quotes:
    get:
      operationId: listQuotes
      parameters:
        - name: appid
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: product_id
          in: query
          description: All platform and side quotes for one catalog product.
          schema: {type: integer, format: int64, minimum: 1}
        - name: platform
          in: query
          schema: {type: string}
        - name: side
          in: query
          schema: {type: string, enum: [bid, ask]}
        - name: keyword
          in: query
          description: Case-insensitive substring match on the product name.
          schema: {type: string, maxLength: 128}
        - name: item_type
          in: query
          schema: {type: string, maxLength: 128}
        - name: item_types
          in: query
          description: Repeated product item_type labels. Combined with steam_cats by AND.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 128
            items: {type: string, maxLength: 128}
        - name: steam_cats
          in: query
          description: Repeated Rust category_steamcat slugs expanded to item class labels.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            items: {type: string}
        - name: min_cents
          in: query
          description: Only products with a last present price at or above this value.
          schema: {type: integer, format: int64, minimum: 0}
        - name: max_cents
          in: query
          schema: {type: integer, format: int64, minimum: 0}
        - name: dropped
          in: query
          description: If 1, only quotes whose current present price is below the window high.
          schema: {type: string, enum: ["1", "true"]}
        - name: drop_window
          in: query
          description: Lookback used for window high, drop amount, and drop percent. Default 24h.
          schema: {type: string, enum: [24h, 7d, 30d], default: 24h}
        - name: min_drop_cents
          in: query
          description: Only quotes whose window drop is at least this many cents.
          schema: {type: integer, format: int64, minimum: 0}
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_desc, price_asc, listings_desc, name, drop_desc, drop_pct_desc]
            default: price_desc
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 60}
      responses:
        "200":
          description: One page of latest attempts with the total match count
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [total, quotes]
                properties:
                  total: {type: integer, format: int64, minimum: 0}
                  quotes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Quote"
  /api/price-ticks:
    get:
      operationId: listPriceTicks
      parameters:
        - name: product_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: platform
          in: query
          schema: {type: string}
        - name: side
          in: query
          schema: {type: string, enum: [bid, ask]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Recent CNY-cent price changes, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ticks]
                properties:
                  ticks:
                    type: array
                    items:
                      $ref: "#/components/schemas/PriceTick"
        "400": {$ref: "#/components/responses/Error"}
components:
  parameters:
    AccountID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    NodeID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CombinationID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProviderID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TargetID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  securitySchemes:
    controlSession:
      type: apiKey
      in: cookie
      name: buffgo_control_session
    csrfToken:
      type: apiKey
      in: header
      name: X-Buffgo-CSRF
  schemas:
    SecurityContext:
      type: object
      additionalProperties: false
      required:
        - csrf_token
        - expires_at
      properties:
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
        expires_at:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - invalid_host
            - method_not_allowed
