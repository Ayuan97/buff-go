<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #3a9fd4;
      --sky-mid: #8fd0ea;
      --sky-low: #d7efc4;
      --sun: #ffe27a;
      --hill-far: #7dae7a;
      --hill-mid: #4e8c5c;
      --road: #4b5158;
      --road-edge: #3a3f44;
      --dash: #e6d36a;
      --grass: #3a7a42;
      --grass-dark: #2c6234;
      --frame: #1e6a67;
      --frame-dark: #144845;
      --metal: #c5c8cc;
      --tire: #1b1c20;
      --pelican: #f6f2e8;
      --pelican-shade: #ddd4c4;
      --wingtip: #2a2b32;
      --bill: #f0a02c;
      --bill-dark: #cf7a12;
      --pouch: #ee9b74;
      --pouch-dark: #d47854;
      --foot: #e07a28;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #16303a;
      font-family: Georgia, "Songti SC", serif;
    }

    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    h1 {
      margin: 0 0 10px;
      color: #e8f4f2;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    svg.scene {
      width: min(96vw, 160vh);
      height: auto;
      max-height: 86vh;
      display: block;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      background: #3a9fd4;
    }

    .scroll-far { animation: slide 28s linear infinite; }
    .scroll-mid { animation: slide 16s linear infinite; }
    .scroll-near { animation: slide 3.2s linear infinite; }
    .scroll-dash { animation: slide 1.6s linear infinite; }

    .wheel-spin { transform-origin: center; animation: spin 0.72s linear infinite; }
    .cog-spin { transform-origin: center; animation: spin 0.72s linear infinite; }

    .rider-bounce { animation: bounce 1.6s ease-in-out infinite; }
    .head-bob { transform-box: fill-box; transform-origin: 70% 80%; animation: nod 1.6s ease-in-out infinite; }
    .bill-tip { transform-box: fill-box; transform-origin: 8% 50%; animation: bill 1.6s ease-in-out infinite; }
    .pouch-wobble { transform-box: fill-box; transform-origin: 20% 10%; animation: pouch 1.6s ease-in-out infinite; }
    .wing-flap { transform-box: fill-box; transform-origin: 88% 30%; animation: flap 1.6s ease-in-out infinite; }
    .far-wing { transform-box: fill-box; transform-origin: 12% 40%; animation: flap-far 3.2s ease-in-out infinite; }

    @keyframes slide {
      from { transform: translateX(0); }
      to { transform: translateX(-960px); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(3px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(3.5px); }
    }

    @keyframes nod {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(5deg); }
    }

    @keyframes bill {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-4deg); }
      70% { transform: rotate(2deg); }
    }

    @keyframes pouch {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50% { transform: scaleY(1.08) scaleX(0.97); }
    }

    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-14deg); }
      55% { transform: rotate(6deg); }
      78% { transform: rotate(-5deg); }
    }

    @keyframes flap-far {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-far, .scroll-mid, .scroll-near, .scroll-dash,
      .wheel-spin, .cog-spin, .rider-bounce, .head-bob,
      .bill-tip, .pouch-wobble, .wing-flap, .far-wing {
        animation: none !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) return;

      var BB = { x: 428, y: 376 };
      var CRANK = 28;
      var HIP_NEAR = { x: 412, y: 300 };
      var HIP_FAR = { x: 420, y: 304 };
      var THIGH = 54;
      var SHIN = 50;
      var PERIOD = 1600;

      var crank = document.getElementById("crank");
      var chain = document.getElementById("chain");
      var nearThigh = document.getElementById("near-thigh");
      var nearShin = document.getElementById("near-shin");
      var nearKnee = document.getElementById("near-knee");
      var nearFoot = document.getElementById("near-foot");
      var farThigh = document.getElementById("far-thigh");
      var farShin = document.getElementById("far-shin");
      var farFoot = document.getElementById("far-foot");
      var pedalNear = document.getElementById("pedal-near");
      var pedalFar = document.getElementById("pedal-far");

      function pedalAt(angle) {
        return {
          x: BB.x + Math.cos(angle) * CRANK,
          y: BB.y + Math.sin(angle) * CRANK
        };
      }

      function kneeOf(hip, pedal, bendSign) {
        var dx = pedal.x - hip.x;
        var dy = pedal.y - hip.y;
        var dist = Math.hypot(dx, dy);
        var max = THIGH + SHIN - 0.8;
        if (dist < 1) dist = 1;
        if (dist > max) dist = max;
        var cosA = (THIGH * THIGH + dist * dist - SHIN * SHIN) / (2 * THIGH * dist);
        if (cosA > 1) cosA = 1;
        if (cosA < -1) cosA = -1;
        var a = Math.acos(cosA);
        var base = Math.atan2(dy, dx);
        var kneeAngle = base + bendSign * a;
        return {
          x: hip.x + Math.cos(kneeAngle) * THIGH,
          y: hip.y + Math.sin(kneeAngle) * THIGH
        };
      }

      function setLine(el, x1, y1, x2, y2) {
        el.setAttribute("x1", x1.toFixed(2));
        el.setAttribute("y1", y1.toFixed(2));
        el.setAttribute("x2", x2.toFixed(2));
        el.setAttribute("y2", y2.toFixed(2));
      }

      function footPath(px, py, facing) {
        var dir = facing;
        return (
          "M" + (px - 8 * dir) + " " + (py - 2) +
          " Q" + px + " " + (py - 12) + " " + (px + 20 * dir) + " " + (py + 2) +
          " Q" + (px + 18 * dir) + " " + (py + 12) + " " + px + " " + (py + 14) +
          " Q" + (px - 12 * dir) + " " + (py + 10) + " " + (px - 8 * dir) + " " + (py - 2) + " Z"
        );
      }

      function frame(now) {
        var angle = (now / PERIOD) * Math.PI * 2;
        var deg = (angle * 180) / Math.PI;
        crank.setAttribute("transform", "rotate(" + deg + " " + BB.x + " " + BB.y + ")");

        var pN = pedalAt(angle);
        var pF = pedalAt(angle + Math.PI);
        var kN = kneeOf(HIP_NEAR, pN, -1);
        var kF = kneeOf(HIP_FAR, pF, -1);

        setLine(nearThigh, HIP_NEAR.x, HIP_NEAR.y, kN.x, kN.y);
        setLine(nearShin, kN.x, kN.y, pN.x, pN.y);
        nearKnee.setAttribute("cx", kN.x.toFixed(2));
        nearKnee.setAttribute("cy", kN.y.toFixed(2));
        setLine(farThigh, HIP_FAR.x, HIP_FAR.y, kF.x, kF.y);
        setLine(farShin, kF.x, kF.y, pF.x, pF.y);

        nearFoot.setAttribute("d", footPath(pN.x, pN.y, 1));
        farFoot.setAttribute("d", footPath(pF.x, pF.y, 1));

        pedalNear.setAttribute("x", (pN.x - 8).toFixed(2));
        pedalNear.setAttribute("y", (pN.y - 3.5).toFixed(2));
        pedalFar.setAttribute("x", (pF.x - 8).toFixed(2));
        pedalFar.setAttribute("y", (pF.y - 3.5).toFixed(2));

        if (chain) {
          chain.setAttribute("stroke-dashoffset", ((-now / 25) % 18).toFixed(2));
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
